<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .cell-text { font-family: "SF Pro Text", "Helvetica Neue", Monaco, monospace; font-size: 18px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #0284c7; text-anchor: middle; }
      .cell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .cell-highlight { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .cell-final { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .box-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background container -->
  <rect x="10" y="10" width="900" height="300" class="box-bg" />

  <!-- === Grid 1: Original (3x4) === -->
  <g transform="translate(40, 40)">
    <text x="100" y="25" class="title">初始网格 (3 × 4)</text>
    <g transform="translate(0, 45)">
      <!-- Row 0: 1, 3, 2, 5 -->
      <rect x="0" y="0" width="50" height="50" class="cell"/><text x="25" y="25" class="cell-text">1</text>
      <rect x="50" y="0" width="50" height="50" class="cell"/><text x="75" y="25" class="cell-text">3</text>
      <rect x="100" y="0" width="50" height="50" class="cell"/><text x="125" y="25" class="cell-text">2</text>
      <rect x="150" y="0" width="50" height="50" class="cell"/><text x="175" y="25" class="cell-text">5</text>
      <!-- Row 1: 6, 2, 4, 4 -->
      <rect x="0" y="50" width="50" height="50" class="cell"/><text x="25" y="75" class="cell-text">6</text>
      <rect x="50" y="50" width="50" height="50" class="cell"/><text x="75" y="75" class="cell-text">2</text>
      <rect x="100" y="50" width="50" height="50" class="cell"/><text x="125" y="75" class="cell-text">4</text>
      <rect x="150" y="50" width="50" height="50" class="cell"/><text x="175" y="75" class="cell-text">4</text>
      <!-- Row 2: 5, 4, 1, 3 -->
      <rect x="0" y="100" width="50" height="50" class="cell"/><text x="25" y="125" class="cell-text">5</text>
      <rect x="50" y="100" width="50" height="50" class="cell"/><text x="75" y="125" class="cell-text">4</text>
      <rect x="100" y="100" width="50" height="50" class="cell"/><text x="125" y="125" class="cell-text">1</text>
      <rect x="150" y="100" width="50" height="50" class="cell"/><text x="175" y="125" class="cell-text">3</text>
    </g>
  </g>

  <!-- Arrow 1: Row Sort -->
  <g transform="translate(260, 160)">
    <text x="45" y="-12" class="arrow-text">每行升序排序</text>
    <line x1="5" y1="0" x2="85" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- === Grid 2: After Row Sort === -->
  <g transform="translate(370, 40)">
    <text x="100" y="25" class="title">完成行排序后</text>
    <g transform="translate(0, 45)">
      <!-- Row 0: 1, 2, 3, 5 -->
      <rect x="0" y="0" width="50" height="50" class="cell-highlight"/><text x="25" y="25" class="cell-text">1</text>
      <rect x="50" y="0" width="50" height="50" class="cell-highlight"/><text x="75" y="25" class="cell-text">2</text>
      <rect x="100" y="0" width="50" height="50" class="cell-highlight"/><text x="125" y="25" class="cell-text">3</text>
      <rect x="150" y="0" width="50" height="50" class="cell-highlight"/><text x="175" y="25" class="cell-text">5</text>
      <!-- Row 1: 2, 4, 4, 6 -->
      <rect x="0" y="50" width="50" height="50" class="cell-highlight"/><text x="25" y="75" class="cell-text">2</text>
      <rect x="50" y="50" width="50" height="50" class="cell-highlight"/><text x="75" y="75" class="cell-text">4</text>
      <rect x="100" y="50" width="50" height="50" class="cell-highlight"/><text x="125" y="75" class="cell-text">4</text>
      <rect x="150" y="50" width="50" height="50" class="cell-highlight"/><text x="175" y="75" class="cell-text">6</text>
      <!-- Row 2: 1, 3, 4, 5 -->
      <rect x="0" y="100" width="50" height="50" class="cell-highlight"/><text x="25" y="125" class="cell-text">1</text>
      <rect x="50" y="100" width="50" height="50" class="cell-highlight"/><text x="75" y="125" class="cell-text">3</text>
      <rect x="100" y="100" width="50" height="50" class="cell-highlight"/><text x="125" y="125" class="cell-text">4</text>
      <rect x="150" y="100" width="50" height="50" class="cell-highlight"/><text x="175" y="125" class="cell-text">5</text>
    </g>
  </g>

  <!-- Arrow 2: Col Sort -->
  <g transform="translate(590, 160)">
    <text x="45" y="-12" class="arrow-text">每列升序排序</text>
    <line x1="5" y1="0" x2="85" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- === Grid 3: After Col Sort (Final) === -->
  <g transform="translate(700, 40)">
    <text x="100" y="25" class="title">完成列排序后 (最终结果)</text>
    <g transform="translate(0, 45)">
      <!-- Row 0: 1, 2, 3, 5 -->
      <rect x="0" y="0" width="50" height="50" class="cell-final"/><text x="25" y="25" class="cell-text">1</text>
      <rect x="50" y="0" width="50" height="50" class="cell-final"/><text x="75" y="25" class="cell-text">2</text>
      <rect x="100" y="0" width="50" height="50" class="cell-final"/><text x="125" y="25" class="cell-text">3</text>
      <rect x="150" y="0" width="50" height="50" class="cell-final"/><text x="175" y="25" class="cell-text">5</text>
      <!-- Row 1: 1, 3, 4, 5 -->
      <rect x="0" y="50" width="50" height="50" class="cell-final"/><text x="25" y="75" class="cell-text">1</text>
      <rect x="50" y="50" width="50" height="50" class="cell-final"/><text x="75" y="75" class="cell-text">3</text>
      <rect x="100" y="50" width="50" height="50" class="cell-final"/><text x="125" y="75" class="cell-text">4</text>
      <rect x="150" y="50" width="50" height="50" class="cell-final"/><text x="175" y="75" class="cell-text">5</text>
      <!-- Row 2: 2, 4, 4, 6 -->
      <rect x="0" y="100" width="50" height="50" class="cell-final"/><text x="25" y="125" class="cell-text">2</text>
      <rect x="50" y="100" width="50" height="50" class="cell-final"/><text x="75" y="125" class="cell-text">4</text>
      <rect x="100" y="100" width="50" height="50" class="cell-final"/><text x="125" y="125" class="cell-text">4</text>
      <rect x="150" y="100" width="50" height="50" class="cell-final"/><text x="175" y="125" class="cell-text">6</text>
    </g>
  </g>
</svg>